<style>
:root{--bg:#000;--surface:#101010;--text:#fff;--muted:#d4d4d4;--line:#6b6b6b;--brand:#4B0082;--brand-hi:#B794F6;--brand-ink:#fff;--brand-soft:#241040;--c1:#B794F6;--c2:#ffffff;--c3:#38d0ff;--c4:#ff7a45;--accent:#B794F6;--focus:#B794F6;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{display:flex;justify-content:center;padding:0}
.app{width:100%;background:var(--bg);min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.stage.mobile .app{max-width:520px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stage.tablet .app{max-width:none;border:0}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#141414;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:8px;min-width:0}
.bl{display:flex;align-items:center;gap:10px}
.bl svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wm{font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1;color:#fff}
.wm b{color:var(--brand-hi);font-weight:800}
.tag{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e6e6e6;line-height:1.55}
/* workspace centrale luminoso (contenuto e finestre) */
main,.modal{--bg:#f3f3f0;--surface:#fff;--text:#0b0b0b;--muted:#4a4a4a;--line:#cdcdcd;--brand-soft:#ede5f7;--accent:#000;--focus:#4B0082;--c1:#4B0082;--c2:#e4572e;--c3:#0077b6;--c4:#2e9b55;color:var(--text)}
main{background:var(--bg)}
.layout{display:flex;flex:1;min-height:0}
nav.side{display:none}
main{flex:1;min-width:0;padding:20px;padding-bottom:90px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.card .ic svg,.tab svg,.side button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .stat{margin-top:auto;font-size:13px;color:var(--col);font-weight:600}
.panel{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.back{background:none;border:none;color:var(--accent);font-weight:600;font:inherit;cursor:pointer;padding:0 0 12px}
.tabbar{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}

.stage.tablet nav.side{display:flex;flex-direction:column;gap:4px;width:250px;flex-shrink:0;padding:22px 14px;background:#000;border-right:2px solid var(--brand);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.side .sbrand{padding:0 6px 20px;margin-bottom:10px;border-bottom:1px solid #333}
.side .slab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3a3a3;margin:22px 14px 6px}
.side .n{margin-left:auto;background:#1f1f1f;color:#fff;border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;min-width:26px;text-align:center}
.sd{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin:0 7px}
.sd.scad{background:#ff4d4d}.sd.ck{background:#38b6ff}.sd.att{background:var(--brand-hi)}
.stage.tablet header{display:none}
.stage.tablet .side button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--muted);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
.stage.tablet .side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-hi);font-weight:600}
.stage.tablet .tabbar{display:none}
.stage.tablet main{padding:32px 40px}
.stage.tablet .grid{grid-template-columns:1fr 1fr}
.stage.tablet .card{min-height:170px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.uact{display:flex;gap:8px;flex-shrink:0}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0}
.ab .i{font-size:26px;line-height:1;font-weight:400}.ab .t{display:none}

.stage.tablet .ab{width:auto;height:auto;border-radius:12px;padding:10px 18px}
.stage.tablet .ab .i{display:none}.stage.tablet .ab .t{display:inline}
.search{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.dbar div{display:flex;gap:8px}
.dbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.dbar .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.dbar button:disabled{opacity:.5;cursor:default}
.urow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.urow.sel{border-color:#dc2626}
.urow input[type=checkbox]{width:20px;height:20px;margin-top:10px;flex-shrink:0;accent-color:#dc2626}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.cells b{color:var(--text);font-size:16px}
.cells span{overflow:hidden;text-overflow:ellipsis}
.unm{min-width:0}.unm b{overflow-wrap:anywhere}.unm .dc{margin-left:6px}.ubd{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.ubd:empty{display:none}.ubd .st{margin-left:0}
.cells>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cells>span[data-l]::before{content:attr(data-l) ": ";font-weight:600;color:#555}
.stage.tablet .cells>span[data-l]::before{content:none}.cells>span[data-l="Obiettivi"]{white-space:normal}.stage.tablet .cells>*{min-width:0}
.uhead{display:none}
.stage.tablet .uhead{display:grid;padding:0 14px 8px 68px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage.tablet .cells{display:grid;grid-template-columns:minmax(170px,1.8fr) .6fr 1.6fr .9fr 1.1fr 1.6fr;gap:14px;align-items:center}
.stage.tablet .uhead{grid-template-columns:minmax(170px,1.8fr) .6fr 1.6fr .9fr 1.1fr 1.6fr;gap:14px;font-weight:700}
.stage.tablet .urow{align-items:center}
.stage.tablet .urow input[type=checkbox]{margin-top:0}
.stage.tablet .cells{font-size:13px}.stage.tablet .cells b{font-size:15px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}

.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

.mrow .pri{background:var(--brand);border-color:var(--brand);color:#fff}.mrow .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.idbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.idrow{display:flex;gap:10px;flex-wrap:wrap}
.drop{flex:1;min-width:130px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.drop input{font-size:12px;padding:6px;max-width:100%}
.drop img{display:none;width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.idbox button{padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.idbox .idrow button{background:var(--surface);color:var(--text);border-color:var(--line)}
.idbox button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}
.dc{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);background:var(--brand-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}.det dt{color:var(--muted)}.det dd{margin:0;word-break:break-word}
.btns{display:flex;gap:6px}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.pb.cam{background:var(--brand);color:#fff}
.idbox pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.idbox summary{font-size:12px;color:var(--muted);cursor:pointer}
.stage.tablet .cells.two{grid-template-columns:1fr 2fr}
.trend{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.trend h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-width:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart line{stroke:var(--line);stroke-width:1}.chart text{font-size:11px;fill:var(--muted)}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.leg{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.mbox.wide{max-width:560px}
.exr{display:grid;grid-template-columns:auto 1.7fr .7fr .7fr .8fr auto;gap:6px;align-items:center}
.lkb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:36px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.lkb:disabled{opacity:.35;cursor:default}
.exr.lk .lkb{background:var(--brand);border-color:var(--brand);color:#fff}
.exr.grp{border-left:3px solid var(--brand);padding-left:6px;margin-left:-9px}
.exr input{padding:8px;min-width:0}
.xr{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;width:32px;height:36px;font-size:18px;cursor:pointer}
.addx{align-self:flex-start;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.stab{width:100%;border-collapse:collapse;font-size:14px}.stab th,.stab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.stab th{color:var(--muted);font-weight:600;font-size:12px}


#login{position:fixed;inset:0;z-index:1000;background:#000;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
body.locked .app,body.locked .notice{display:none}
.lbox{width:100%;max-width:400px;background:#101010;border:1px solid #6b6b6b;border-radius:18px;padding:26px;color:#fff}

:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

h2{font-weight:800}

function deadlines(u){

var Store=(function(){
  var db=null,mode='',ready=null,LSK='speaking_v1_';
  function idbOpen(){return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('noidb'));return}

      d.onversionchange=function(){try{d.close()}catch(e){}db=null};d.onclose=function(){db=null};res(d)};
    r.onerror=function(){if(done)return;done=true;clearTimeout(t);rej(r.error||new Error('idb'))};
  })}

    var t;try{t=db.transaction(n,md)}catch(e){rej(e);return}
    var q=fn(t.objectStore(n));

    t.onerror=t.onabort=function(){rej(t.error||new Error('tx'))};
  })}

  function lsGet(n){try{var o=JSON.parse(localStorage.getItem(LSK+n)||'{}');return o&&typeof o==='object'?o:{}}catch(e){return {}}}
  function strip(o){var c={};Object.keys(o).forEach(function(k){if(!(window.Blob&&o[k] instanceof Blob))c[k]=o[k]});return c}
  function vals(o){return Object.keys(o).map(function(k){return o[k]})}

    mode:function(){return mode},
    load:function(){

    },

function trendPts(u,k){
  var out=[];
  schedeOf(u).forEach(function(sc){var best=null;sc.es.forEach(function(e){if(ekey(e.n)===k&&e.k!==''&&e.k!=null&&!isNaN(+e.k)){var v=+e.k;if(best===null||v>best)best=v}});if(best!==null)out.push({d:sc.data,t:Date.parse(sc.data),v:best})});
  return out.sort(function(a,b){return a.t-b.t});
}
function sdate(iso){var f=fdate(iso);return f.slice(0,6)+f.slice(8)}
function drawChart(ser){
  var W=600,H=260,L=44,R=16,T=14,B=30,all=[],ts=[];
  ser.forEach(function(s){s.pts.forEach(function(p){all.push(p.v);ts.push(p.t)})});
  if(!all.length)return '<div class="status">Nessun carico registrato per questi esercizi.</div>';
  var vmin=Math.min.apply(null,all),vmax=Math.max.apply(null,all),pad=(vmax-vmin)||vmax||1;
  vmin=Math.max(0,vmin-pad*.15);vmax=vmax+pad*.15;
  var tmin=Math.min.apply(null,ts),tmax=Math.max.apply(null,ts),dt=(tmax-tmin)||1;
  function X(t){return tmax===tmin?L+(W-L-R)/2:L+(t-tmin)/dt*(W-L-R)}
  function Y(v){return T+(1-(v-vmin)/(vmax-vmin))*(H-T-B)}
  var g='',i;
  for(i=0;i<=4;i++){var v=vmin+(vmax-vmin)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fnum(Math.round(v*10)/10)+'</text>'}
  var dates=[];ser.forEach(function(s){s.pts.forEach(function(p){if(dates.indexOf(p.d)<0)dates.push(p.d)})});dates.sort();
  var pick=dates.length<=5?dates:[0,1,2,3,4].map(function(j){return dates[Math.round(j*(dates.length-1)/4)]});
  pick.forEach(function(d){g+='<text x="'+X(Date.parse(d))+'" y="'+(H-8)+'" text-anchor="middle">'+sdate(d)+'</text>'});
  ser.forEach(function(s){
    if(s.pts.length>1)g+='<polyline style="stroke:'+s.color+'" points="'+s.pts.map(function(p){return X(p.t)+','+Y(p.v)}).join(' ')+'"/>';
    s.pts.forEach(function(p){g+='<circle cx="'+X(p.t)+'" cy="'+Y(p.v)+'" r="4.5" style="fill:'+s.color+'"><title>'+esc(s.name)+' · '+fdate(p.d)+' · '+fnum(p.v)+' kg</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del carico in kg nel tempo">'+g+'</svg>';
}

    return '<span><i class="dot" style="background:'+s.color+'"></i><b>'+esc(s.name)+'</b>: '+t+'</span>'}).join('')+'</div>';
}

['Trazioni sul judogi (Gi pull-up)','Pull','lv','Dorso','Bicipiti',3,'acc','bw','Gran dorsale, flessori delle dita','Bicipiti, romboidi, avambracci',

['Landmine rotational press','Push','cr','Core','Deltoidi,Glutei',2,'plyo','lr','Obliqui, grande gluteo, deltoide anteriore','Tricipite, dentato anteriore',

['Jump squat zavorrato','Squat','sp','Quadricipiti','Glutei,Polpacci',3,'plyo','','Quadricipiti, grande gluteo','Polpacci, erettori spinali',

['Power clean da sospensione','Hinge','hp','Glutei','Ischiocrurali,Quadricipiti,Dorso',3,'plyo','vs','Grande gluteo, ischiocrurali, quadricipiti, trapezi','Polpacci, dorsali, erettori spinali',

['Turkish get-up','Isopush','ca','Core','Deltoidi,Glutei',2,'core','lr','Stabilizzatori della spalla, addominali, obliqui','Grande gluteo, deltoidi, tricipite',

['Isometrie del collo e ponte','Isopush','ci','','',2,'core','tm','Muscoli estensori e flessori del collo','Trapezi, erettori spinali',

['Circuito Y-T-W-L','Pull','li','Deltoidi','Dorso',1,'iso','','Sottospinato, sovraspinato, piccolo rotondo, trapezio inferiore','Romboidi, deltoide posteriore',

// Respirazione (sintetica per la tabella, estesa per la legenda)
function breath(e){
  if(e.role==='plyo')return 'Inspira nel caricamento, espira con decisione nella fase esplosiva.';
  if(e.role==='cond')return 'Respirazione ritmica e profonda, sincronizzata con il gesto; non trattenere il fiato.';
  if(e.role==='wu')return e.wk==='cardio'?'Respirazione libera e regolare, a un ritmo che ti permette di parlare.':e.wk==='str'||e.wk==='foam'?'Respira lentamente e a fondo; espira mentre accentui l’allungamento o la pressione.':'Respira in modo regolare, senza trattenere il fiato.';
  if(e.n==='Vacuum addominale')return 'Espira a fondo, poi a polmoni vuoti mantieni l’addome risucchiato; riprendi a respirare tra una ripetizione e l’altra.';
  if(e.sub==='cf')return 'Espira mentre fletti il busto, inspira tornando nella posizione iniziale.';
  if(e.role==='core')return 'Respira in modo lento e continuo, senza trattenere il fiato e senza perdere la tensione dell’addome.';
  if(e.role==='carry')return 'Respiri corti e regolari, addome sempre attivo.';
  if(e.role==='mob')return 'Espira lentamente entrando nell’allungamento; non trattenere il fiato.';
  if(hasF(e,'vs'))return 'Inspira e blocca il core prima della fase eccentrica, espira dopo aver superato il punto critico della risalita.';
  return {Push:'Inspira nella fase di discesa, espira mentre spingi.',Pull:'Espira mentre tiri, inspira nel ritorno controllato.',Squat:'Inspira e blocca il core prima di scendere, espira in risalita.',Hinge:'Inspira e blocca il core prima di piegarti, espira nell’estensione delle anche.'}[e.p]||'Inspira nella fase eccentrica, espira nella concentrica.';
}
function exNote(e){return e.as+' Respirazione: '+breath(e).charAt(0).toLowerCase()+breath(e).slice(1)}

 ['Superserie (SS) / triserie','Due o tre esercizi uno dopo l’altro senza pausa; il recupero si fa alla fine del giro. In scheda hanno la stessa sigla SS.'],

function addBlock(id){
  var b=BLK.filter(function(x){return x.id===id})[0];if(!b||!ED.sc)return;
  var D=ED.sc.days[ED.day],c=gctx||profile({}),used=edUsed(),day=D.es.filter(function(x){return x.n}).map(function(x){return {n:x.n}}),rows=[];
  if(b.empty){for(var i=0;i<b.empty;i++)rows.push({lk:i>0})}
  else if(b.rows){b.rows.forEach(function(x){var e=EXI[ekey(x[0])];if(!e||!okEx(e,c,3))return;var r=edRowFrom(e,c);spDose(r,x[1],e,c);r.af={s:r.s,r:r.r,rpe:r.rpe,tg:r.tg,k:r.k,rec:r.rec};if(x[2]&&rows.length)r.lk=true;rows.push(r)})}
  else if(b.mob){var need=c.mob.length?c.mob:['mh','ms','mi','mk'];
    EXDB.filter(function(e){return e.role==='mob'&&okEx(e,c,3)&&!day.some(function(x){return x.n===e.n})}).map(function(e){return {e:e,s:need.filter(function(m){return hasF(e,m)}).length*2-(used[e.n]||0)}})
     .sort(function(a,z){return z.s-a.s}).slice(0,b.mob).forEach(function(x){rows.push(edRowFrom(x.e,c))})}
  else b.slots.forEach(function(sl){var e=pick(sl,c,used,day);if(e){day.push(e);used[e.n]=(used[e.n]||0)+1;
    var r=edRowFrom(e.role==='main'?Object.assign({},e,{role:'acc'}):e,c);if(b.lk&&rows.length)r.lk=true;rows.push(r)}});
  closeModal();
  if(!rows.length){st('edstat','Nessun esercizio adatto a questo profilo per il blocco scelto: aggiungilo dalla libreria.');return}
  var es=D.es.filter(function(x){return x.n||x.lk});
  D.es=b.top?rows.concat(es):es.concat(rows);D.es[0].lk=false;
  if(sgAuto()&&!b.empty)ED.sg=b.top?rows.length-1:D.es.length-1;
  edMark();edRefresh();st('edstat','Aggiunto «'+b.t+'»: '+rows.length+(rows.length===1?' riga':' righe')+'. Modifiche non salvate.');
}
function addGenDay(type){if(!DT[type]||!ED.sc)return;
  var c=gctx||profile({}),used=edUsed(),tpl=DT[type][ED.sc.days.length%DT[type].length].map(slot),es=[];
  tpl.forEach(function(sl){var e=pick(sl,c,used,es);if(e){es.push(e);used[e.n]=(used[e.n]||0)+1}});
  var nm=0,rows=es.map(function(e){if(e.role==='main'&&++nm>2)e=Object.assign({},e,{role:'acc'});return edRowFrom(e,c)});
  closeModal();ED.sc.days.splice(ED.day+1,0,{t:DTT[type],es:rows.length?rows:[{}]});ED.day++;ED.sg=null;edMark();renderEd();
  st('edstat','Aggiunta la seduta «'+DTT[type]+'» con '+rows.length+' esercizi. Modifiche non salvate.');
}

   '<div class="avwk"><select id="avwk" aria-label="Settimana">'+wopt+'</select>'+(ws?'<span>dal '+fdate(ws).slice(0,5)+' al '+fdate(addDays(ws,6)).slice(0,5)+'</span>':'')+'</div>'+
   (wk===dw?'<div class="avdl">Settimana di scarico: stessi esercizi, circa metà delle serie e carichi più leggeri (RPE 6–7).</div>':'')+'</div>'+
   (D.length>1?'<div class="avtabs" role="tablist">'+D.map(function(x,j){return '<button role="tab" data-avd="'+j+'" aria-selected="'+(j===di)+'">'+esc(x[0]||'Seduta '+(j+1))+'</button>'}).join('')+'</div>':'')+
   avWuList(AV.W,AV.wt,'🔥 Riscaldamento');
  h+=d[1].map(function(e,j){
    var k=di+'|'+e[0],sets=lg[k]||[],n=avNum(e[1]),g=e[8],ex=EXI[ekey(e[0])],done=0,rows='';
    for(var s=0;s<n;s++){var x=sets[s]||{};if(x.ok)done++;
      rows+='<div class="avs'+(x.ok?' ok':'')+'" data-k="'+esc(k)+'" data-s="'+s+'" data-rec="'+esc(e[5])+'"><span class="avsn">'+(s+1)+'</span>'+
       '<input class="avkg" inputmode="decimal" placeholder="kg" aria-label="Kg serie '+(s+1)+'" value="'+esc(x.kg||'')+'">'+
       '<input class="avrp" inputmode="numeric" placeholder="'+esc(String(e[2]||'rip').slice(0,8))+'" aria-label="Ripetizioni serie '+(s+1)+'" value="'+esc(x.rp||'')+'">'+
       '<button class="avok" data-avok aria-pressed="'+!!x.ok+'" aria-label="Serie '+(s+1)+' fatta">✓</button></div>'}
    return '<div class="avc'+(done>=n?' fin':'')+'"><div class="avn">'+(g?'<i class="dc">SS '+String.fromCharCode(64+(+g))+'</i> ':'')+esc(e[0])+'<span class="avcnt">'+done+'/'+n+'</span></div>'+
     '<div class="avp">'+(e[1]!==''?'<span><b>'+esc(e[1])+'</b> serie</span>':'')+(e[2]!==''?'<span><b>'+esc(e[2])+'</b> rip.</span>':'')+(e[3]!==''?'<span>RPE <b>'+esc(e[3])+'</b></span>':'')+(e[5]!==''?'<span>Rec. <b>'+esc(e[5])+' s</b></span>':'')+'</div>'+
     (e[4]?'<div class="avtg">Carico: '+esc(e[4])+'</div>':'')+(e[6]?'<p class="avnt">'+esc(e[6])+'</p>':'')+
     (g&&d[1][j+1]&&d[1][j+1][8]===g?'<p class="avss">Superserie: passa subito all’esercizio successivo, recupera dopo.</p>':'')+
     '<div class="avsh"><span>Serie</span><span>Kg</span><span>Ripetizioni</span><span>Fatta</span></div>'+rows+
     (ex?'<details class="avg"><summary>Come si esegue</summary><div class="avgd">'+legendBody(ex)+'</div></details>':'')+'</div>'}).join('')||'<p class="status">Nessun esercizio in questa seduta.</p>';
  h+=avWuList(AV.C,AV.ct,'🧘 Defaticamento')+
   '<div class="avact"><button class="btn pri" data-act="avsend">Invia i risultati al PT</button><button class="btn" data-act="avcopy">Copia i risultati</button></div><p class="status" id="avst" role="status"></p>'+
   '<details class="glw"><summary>📖 Glossario dei termini tecnici</summary>'+glossHtml()+'</details>'+
   '<p class="avft">Scheda preparata dal tuo Personal Trainer il '+fdate(AV.t)+'. Serie e kg che segni restano solo su questo telefono. Per ritrovarla: aggiungi la pagina alla schermata Home (iPhone: Condividi → Aggiungi alla schermata Home; Android: ⋮ → Aggiungi a schermata Home). Apri il link in Safari o Chrome, non dentro WhatsApp o Telegram, così i dati non si perdono.</p></div>'+
   '<div class="avt" id="avt" hidden><span>Recupero</span><b>0:00</b><button data-act="avt15">+15 s</button><button data-act="avtx">Stop</button></div>';
  gid('main').innerHTML=h;
}
function avBeep(){try{if(!AVAC)return;var o=AVAC.createOscillator(),g=AVAC.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(AVAC.destination);o.start();o.stop(AVAC.currentTime+.35)}catch(e){}}
function avTimer(sec){
  var bar=gid('avt');if(!bar)return;clearInterval(AVT&&AVT.iv);AVT={end:Date.now()+sec*1000};bar.hidden=false;bar.classList.remove('end');bar.querySelector('span').textContent='Recupero';
  var tick=function(){var l=Math.max(0,Math.ceil((AVT.end-Date.now())/1000));bar.querySelector('b').textContent=Math.floor(l/60)+':'+('0'+l%60).slice(-2);
    if(l<=0){clearInterval(AVT.iv);bar.classList.add('end');bar.querySelector('span').textContent='Recupero finito: prossima serie';try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}avBeep()}};
  tick();AVT.iv=setInterval(tick,250);
}
function avResults(){
  var di=AVS.day,d=AV.D[di],wk=AVS.wk,lg=AVL[wk]||{},L=[];
  L.push('S.peaking — '+AV.n+(AV.a?' · '+AV.a:''));L.push('Settimana '+wk+(wk===avDlw()?' (scarico)':'')+' · '+(d[0]||'Seduta '+(di+1)));
  d[1].forEach(function(e){var S=(lg[di+'|'+e[0]]||[]).filter(function(x){return x&&(x.ok||x.kg||x.rp)});
    L.push('• '+e[0]+': '+(S.length?S.map(function(x){return (x.kg?x.kg+' kg':'')+(x.kg&&x.rp?' × ':'')+(x.rp?x.rp:'')+(!x.kg&&!x.rp?'fatta':'')}).join(', '):'non segnato'))});
  return L.join('\n');
}
function avUpd(r){var k=r.getAttribute('data-k'),s=+r.getAttribute('data-s'),lg=(AVL[AVS.wk]=AVL[AVS.wk]||{}),a=(lg[k]=lg[k]||[]);
  a[s]={kg:r.querySelector('.avkg').value.trim(),rp:r.querySelector('.avrp').value.trim(),ok:r.classList.contains('ok')};avSave();
  var c=r.closest('.avc'),L=c.querySelectorAll('.avs'),n=c.querySelectorAll('.avs.ok').length;c.querySelector('.avcnt').textContent=n+'/'+L.length;c.classList.toggle('fin',n>=L.length)}
document.addEventListener('input',function(e){if(!AV)return;var r=e.target.closest&&e.target.closest('.avs');if(r)avUpd(r)});
document.addEventListener('change',function(e){if(!AV)return;if(e.target.id==='avwk'){AVS.wk=+e.target.value;avSave();avRender()}});
document.addEventListener('click',function(e){
  if(!AV)return;var t=e.target;
  var d=t.closest('[data-avd]');if(d){AVS.day=+d.getAttribute('data-avd');avSave();avRender();window.scrollTo(0,0);return}
  if(t.closest('[data-avok]')){var r=t.closest('.avs'),on=!r.classList.contains('ok');r.classList.toggle('ok',on);t.closest('[data-avok]').setAttribute('aria-pressed',String(on));
    if(on&&!r.querySelector('.avrp').value){var ph=r.querySelector('.avrp').placeholder;if(/^\d+$/.test(ph))r.querySelector('.avrp').value=ph}
    avUpd(r);
    if(on){try{AVAC=AVAC||new (window.AudioContext||window.webkitAudioContext)()}catch(x){}var rc=parseInt(r.getAttribute('data-rec'),10),c=r.closest('.avc');
      var ss=c.querySelector('.avss');if(rc>0&&!ss)avTimer(rc)}
    return}
  var a=t.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');
  if(k==='avt15'&&AVT){AVT.end=Math.max(AVT.end,Date.now())+15000;clearInterval(AVT.iv);avTimer(Math.ceil((AVT.end-Date.now())/1000))}
  else if(k==='avtx'){clearInterval(AVT&&AVT.iv);gid('avt').hidden=true}
  else if(k==='avsend'){var txt=avResults();if(navigator.share)navigator.share({title:AV.n,text:txt}).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}
  else if(k==='avcopy'){var tx=avResults();(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(function(){st('avst','Risultati copiati: incollali nella chat con il tuo PT.')},function(){st('avst',tx)})}
});
window.addEventListener('hashchange',function(){if(/^#s=/.test(location.hash)||AV)location.reload()});

function autoView(){setView(window.innerWidth>=768?'tablet':'mobile')}
autoView();
window.addEventListener('resize',autoView);
if(/^#s=/.test(location.hash))athleteMode();
else boot();
// ---- Avvio con accesso (Firebase) ----
// a caricamento finito ridisegno solo le pagine di elenco, per non cancellare un modulo che si sta compilando
function safeRender(){if(cur==='home'||(cur==='schede'&&!suid)||(cur==='ed'&&!ED.dirty))render();else renderNav()}
var CBhide=false,lastSync=0,started=false;
function cloudBar(){var e=gid('cloudbar');if(!e)return;var o=Cloud.localOnly();
  if(!Cloud.user()||CBhide||!o.first||!(o.utenti||o.schede)){e.innerHTML='';return}
  e.innerHTML='<div class="info" style="margin:0 0 14px">Su questo dispositivo ci sono <b>'+o.utenti+(o.utenti===1?' cliente':' clienti')+' e '+o.schede+(o.schede===1?' scheda':' schede')+'</b> che non sono ancora nel cloud. Caricali una volta sola: poi li ritrovi su tutti i dispositivi in cui accedi con la tua email.'+
   '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn sm pri" data-act="cloudup">Carica nel cloud</button><button type="button" class="btn sm" data-act="cloudlater">Non ora</button></div></div>'}
function loginView(mode,msg){
  var L=gid('login');if(!L){L=document.createElement('div');L.id='login';document.body.appendChild(L)}
  document.body.classList.add('locked');
  var h='<div class="lbox">'+BRAND;
  if(mode==='wait')h+='<p class="lmsg">Connessione in corso…</p>';
  else if(mode==='fail')h+='<h2>Cloud non raggiungibile</h2><p class="lmsg">Non riesco a collegarmi a Firebase: manca internet, oppure il sito è aperto dal file sul computer invece che dall’indirizzo pubblicato.</p>'+
    '<button class="lgo" data-act="lgretry">Riprova</button><button class="llink" data-act="lglocal">Continua con i dati salvati su questo dispositivo</button><p class="lmsg">In questo modo le modifiche restano su questo dispositivo e vengono inviate al cloud al prossimo accesso.</p>';
  else h+='<h2>Accedi</h2><form id="lform" novalidate><label for="lem">Email</label><input id="lem" type="email" autocomplete="username" inputmode="email" required>'+
    '<label for="lpw">Password</label><input id="lpw" type="password" autocomplete="current-password" required>'+
    '<button class="lgo" type="submit">Accedi</button></form><button class="llink" data-act="lgreset">Password dimenticata?</button>'+
    '<p class="lmsg" id="lmsg" role="status">'+esc(msg||'')+'</p><p class="lnote">Accesso riservato al Personal Trainer: usa l’email e la password create in Firebase → Authentication.</p>';
  L.innerHTML=h+'</div>';
  var f=gid('lem');if(f)f.focus();
}
function loginHide(){var L=gid('login');if(L)L.remove();document.body.classList.remove('locked')}
async function startApp(u){
  loginHide();
  try{render()}catch(e){gid('main').innerHTML='<div class="panel">Errore all’avvio: '+esc(e&&e.message||e)+'. Ricarica la pagina.</div>'}
  await Store.load();
  if(u){var ow=null;try{ow=JSON.parse(localStorage.getItem('spk_owner')||'null')}catch(e){}
    // la copia locale di un altro account non si mescola con questo
    if(ow&&ow!==u.uid){for(var x of U.slice()){try{await Store.ldel('utenti',x.id)}catch(e){}}for(var y of SCH.slice()){try{await Store.ldel('schede',y.id)}catch(e){}}U.length=0;SCH.length=0}
    try{localStorage.setItem('spk_owner',JSON.stringify(u.uid))}catch(e){}}
  safeRender();
  if(u)await cloudSync();
}
async function cloudSync(){
  try{await Cloud.sync();lastSync=Date.now();safeRender()}
  catch(e){var c=String((e&&e.code)||'');showNotice(/permission-denied/.test(c)?'Il cloud non permette di leggere i dati: controlla le regole di Firestore (devono permettere users/{uid}). Stai vedendo la copia salvata su questo dispositivo.':'Non riesco a leggere i dati dal cloud ('+(c||(e&&e.message)||'errore')+'): stai vedendo la copia salvata su questo dispositivo.')}
}
function boot(){
  loginView('wait');
  Cloud.load().then(function(){
    Cloud.onAuth(function(u){
      if(u&&!started){started=true;startApp(u)}
      else if(!u&&started)location.reload();
      else if(!u)loginView('form');
    });
  },function(){loginView('fail')});
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='lform')return;e.preventDefault();
  var em=gid('lem').value.trim(),pw=gid('lpw').value,b=e.target.querySelector('button');
  if(!em||!pw){st('lmsg','Scrivi email e password.');return}
  b.disabled=true;st('lmsg','Accesso in corso…');
  Cloud.signIn(em,pw).catch(function(x){b.disabled=false;st('lmsg',Cloud.aerr(x))});
});
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');
  if(k==='lgretry')location.reload();
  else if(k==='lglocal'){started=true;startApp(null)}
  else if(k==='lgreset'){var em=(gid('lem')||{}).value||'';em=em.trim();
    if(!em){st('lmsg','Scrivi prima la tua email nel campo qui sopra, poi premi «Password dimenticata?».');return}
    Cloud.reset(em).then(function(){st('lmsg','Ti ho mandato un’email per scegliere una nuova password (controlla anche lo spam).')},function(x){st('lmsg',Cloud.aerr(x))})}
  else if(k==='cloudup'){closeBk();if(!Cloud.user())return;var c=Cloud.upload();cloudBar();
    st('bkstat',c.utenti||c.schede?'Caricamento nel cloud avviato: '+c.utenti+' clienti e '+c.schede+' schede. Lo stato è nel menu Backup.':'Tutti i dati di questo dispositivo sono già nel cloud.')}
  else if(k==='cloudlater'){CBhide=true;cloudBar()}
  else if(k==='logout'){closeBk();var p=Cloud.pending();
    modal('<h3>Esci</h3>'+(p?'<p class="status"><b>Attenzione:</b> '+p+(p===1?' modifica non è ancora stata inviata':' modifiche non sono ancora state inviate')+' al cloud (serve internet). Se esci ora restano solo su questo dispositivo; se cancelli i dati, vanno perse.</p>':'')+
      '<p><b>Esci</b>: torni alla schermata di accesso; su questo dispositivo resta la copia dei dati per la prossima volta.</p><p><b>Esci e cancella da questo dispositivo</b>: da usare su un computer o telefono non tuo. I dati restano nel cloud; le foto dei documenti, che sono salvate solo qui, vengono cancellate.</p>'+
      '<div class="mrow"><button data-act="mclose">Annulla</button><button data-act="lgout">Esci</button><button class="danger" data-act="lgwipe">Esci e cancella da questo dispositivo</button></div>')}
  else if(k==='lgout'||k==='lgwipe'){a.disabled=true;Cloud.signOut(k==='lgwipe').then(function(){location.reload()},function(){location.reload()})}
});
// tornando sull'app dopo un po' (es. modifiche fatte sul telefono) rileggo il cloud, ma solo nelle pagine di elenco
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!Cloud.user()||Date.now()-lastSync<60000)return;
  if(cur==='home'&&!dm||(cur==='schede'&&!suid))cloudSync();
});
window.addEventListener('online',function(){var e=gid('cloudst');if(e)e.textContent=Cloud.status()});
window.addEventListener('offline',function(){var e=gid('cloudst');if(e)e.textContent=Cloud.status()});
</script>
