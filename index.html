<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<meta name="color-scheme" content="dark">
<title>S.peaking</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234B0082'/%3E%3Ctext x='32' y='45' font-size='38' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='white'%3ES.%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#000;--surface:#101010;--text:#fff;--muted:#d4d4d4;--line:#6b6b6b;--brand:#4B0082;--brand-hi:#B794F6;--brand-ink:#fff;--brand-soft:#241040;--c1:#B794F6;--c2:#ffffff;--c3:#38d0ff;--c4:#ff7a45;--accent:#B794F6;--focus:#B794F6;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.stage{display:flex;justify-content:center;padding:0}
.app{width:100%;background:var(--bg);min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.stage.mobile .app{max-width:520px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stage.tablet .app{max-width:none;border:0}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#141414;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:8px;min-width:0}
.bl{display:flex;align-items:center;gap:10px}
.bl svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wm{font-family:"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1;color:#fff}
.wm b{color:var(--brand-hi);font-weight:800}
.tag{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e6e6e6;line-height:1.55}
/* workspace centrale luminoso (contenuto e finestre) */
main,.modal{--bg:#f3f3f0;--surface:#fff;--text:#0b0b0b;--muted:#4a4a4a;--line:#cdcdcd;--brand-soft:#ede5f7;--accent:#000;--focus:#4B0082;--c1:#4B0082;--c2:#e4572e;--c3:#0077b6;--c4:#2e9b55;color:var(--text)}
main{background:var(--bg)}
.layout{display:flex;flex:1;min-height:0}
nav.side{display:none}
main{flex:1;min-width:0;padding:20px;padding-bottom:90px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.card .ic svg,.tab svg,.side button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .stat{margin-top:auto;font-size:13px;color:var(--col);font-weight:600}
.panel{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.back{background:none;border:none;color:var(--accent);font-weight:600;font:inherit;cursor:pointer;padding:0 0 12px}
.tabbar{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}
.tab[aria-current="true"]{color:var(--brand-hi);font-weight:600}
.stage.tablet nav.side{display:flex;flex-direction:column;gap:4px;width:250px;flex-shrink:0;padding:22px 14px;background:#000;border-right:2px solid var(--brand);position:sticky;top:0;height:100vh;height:100dvh;overflow:auto}
.side .sbrand{padding:0 6px 20px;margin-bottom:10px;border-bottom:1px solid #333}
.side .slab{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#a3a3a3;margin:22px 14px 6px}
.side .n{margin-left:auto;background:#1f1f1f;color:#fff;border-radius:99px;padding:0 9px;font-size:12px;font-weight:700;min-width:26px;text-align:center}
.sd{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin:0 7px}
.sd.scad{background:#ff4d4d}.sd.ck{background:#38b6ff}.sd.att{background:var(--brand-hi)}
.stage.tablet header{display:none}
.stage.tablet .side button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--muted);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
.stage.tablet .side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand-hi);font-weight:600}
.stage.tablet .tabbar{display:none}
.stage.tablet main{padding:32px 40px}
.stage.tablet .grid{grid-template-columns:1fr 1fr}
.stage.tablet .card{min-height:170px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.uact{display:flex;gap:8px;flex-shrink:0}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0}

.stage.tablet .ab{width:auto;height:auto;border-radius:12px;padding:10px 18px}
.stage.tablet .ab .i{display:none}.stage.tablet .ab .t{display:inline}
.search{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.dbar div{display:flex;gap:8px}
.dbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.dbar .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.dbar button:disabled{opacity:.5;cursor:default}
.urow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.urow.sel{border-color:#dc2626}
.urow input[type=checkbox]{width:20px;height:20px;margin-top:10px;flex-shrink:0;accent-color:#dc2626}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.cells b{color:var(--text);font-size:16px}
.cells span{overflow:hidden;text-overflow:ellipsis}
.uhead{display:none}
.stage.tablet .uhead{display:grid;padding:0 14px 8px 68px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage.tablet .cells{display:grid;grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px;align-items:center}
.stage.tablet .uhead{grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px}
.stage.tablet .urow{align-items:center}
.stage.tablet .urow input[type=checkbox]{margin-top:0}
.stage.tablet .cells{font-size:13px}.stage.tablet .cells b{font-size:15px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0 0 4px}.mbox label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mbox input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}

.empty{text-align:center;color:var(--muted);padding:30px 0}
.idbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.idrow{display:flex;gap:10px;flex-wrap:wrap}
.drop{flex:1;min-width:130px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.drop input{font-size:12px;padding:6px;max-width:100%}
.drop img{display:none;width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.idbox button{padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.idbox .idrow button{background:var(--surface);color:var(--text);border-color:var(--line)}
.idbox button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}
.dc{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);background:var(--brand-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}.det dt{color:var(--muted)}.det dd{margin:0;word-break:break-word}
.btns{display:flex;gap:6px}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.pb.cam{background:var(--brand);color:#fff}
.idbox pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.idbox summary{font-size:12px;color:var(--muted);cursor:pointer}
.stage.tablet .cells.two{grid-template-columns:1fr 2fr}
.trend{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.trend h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-width:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart line{stroke:var(--line);stroke-width:1}.chart text{font-size:11px;fill:var(--muted)}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.leg{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.mbox.wide{max-width:560px}
.exr{display:grid;grid-template-columns:auto 1.7fr .7fr .7fr .8fr auto;gap:6px;align-items:center}
.lkb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:36px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.lkb:disabled{opacity:.35;cursor:default}
.exr.lk .lkb{background:var(--brand);border-color:var(--brand);color:#fff}
.exr.grp{border-left:3px solid var(--brand);padding-left:6px;margin-left:-9px}
.exr input{padding:8px;min-width:0}
.xr{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;width:32px;height:36px;font-size:18px;cursor:pointer}
.addx{align-self:flex-start;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.stab{width:100%;border-collapse:collapse;font-size:14px}.stab th,.stab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.stab th{color:var(--muted);font-weight:600;font-size:12px}


.notice{background:#241040;color:#fff;border-bottom:2px solid var(--brand);padding:10px 20px;font-size:14px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{border-bottom:2px solid var(--brand)}
h2{font-weight:800}
.newbtn{flex:1 1 160px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:16px 20px;font:inherit;font-size:19px;font-weight:800;cursor:pointer}
.stage.tablet .newbtn{flex:0 0 auto;min-width:280px}
.top{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
#bkstat{min-height:22px;margin:8px 0 14px}
.dd{position:relative;display:flex}
.ddb{display:flex;align-items:center;gap:8px;background:#000;color:#fff;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.ddb[aria-expanded="true"]{background:#222}
.ddm{position:absolute;right:0;top:calc(100% + 6px);z-index:10;width:270px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column}
.ddm[hidden]{display:none}
.ddm button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;font:inherit;font-size:15px;font-weight:600;color:var(--text);cursor:pointer}
.ddm button:hover,.ddm button:focus-visible{background:var(--brand-soft)}
.ddm .hint{margin:4px 0 0;padding:8px 12px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.ufil{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.ufil button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.ufil button span{opacity:.65;margin-left:4px}
.ufil button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.ufil button[aria-pressed="true"] span{opacity:1;color:#fff}
.st{font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.st.scad{background:#d62828;color:#fff}.st.ck{background:#0067a3;color:#fff}.st.att{background:var(--brand);color:#fff}
.mrow button{font-weight:600}
.ahead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:26px}
.ahead .back{padding:0}.ahead .sp{flex:1}
.kick{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.atitle{font-size:28px;margin:2px 0 18px;letter-spacing:-.01em}
.pqb{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:700;border-radius:8px;padding:4px 10px;border:1.5px solid}
.pqb.ok{background:#e3f4e8;color:#14622f;border-color:#2e9b55}.pqb.warn{background:#fde8e8;color:#9b1c1c;border-color:#d62828}.pqb.na{background:#eee;color:#444;border-color:#bbb}
.asec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.asec h3{font-size:19px;font-weight:800;margin:0 0 16px;line-height:1.5}.asec h3 small{font-size:14px;font-weight:600;color:var(--muted)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.fl{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#2b2b2b}
.fl.full{grid-column:1/-1}
.fl input,.fl select,.fl textarea{width:100%;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:0;text-transform:none;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.fl textarea{min-height:84px;resize:vertical}
.adet{margin-top:16px}.adet summary{cursor:pointer;font-weight:700;margin-bottom:12px}
.tgs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tg{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.pqr{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.pqr span{flex:1;font-size:15px}
.yn{display:flex;gap:6px;flex-shrink:0}
.yn button{min-width:54px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.yn button[aria-pressed="true"][data-v="no"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.yn button[aria-pressed="true"][data-v="si"]{background:#d62828;color:#fff;border-color:#d62828}
.ptnote{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;font-weight:700;background:var(--brand);color:#fff;border-radius:8px;padding:3px 10px;vertical-align:middle;margin-left:6px}
.warn{border-left:4px solid #d62828;background:#fde8e8;color:#5a0f0f;padding:10px 14px;border-radius:8px;font-size:14px;margin-top:12px}
.info{border-left:4px solid var(--brand);background:var(--brand-soft);color:#2a0a4a;padding:10px 14px;border-radius:8px;font-size:14px;margin-top:14px}
[hidden]{display:none!important}
.afoot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.btn{padding:13px 22px;border-radius:12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--text)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.blk{background:#000;border-color:#000;color:#fff}

.steps{display:flex;gap:6px;flex-wrap:wrap}

.steps button[aria-current]{background:var(--brand);border-color:var(--brand);color:#fff}
.tgh{font-size:20px;font-weight:800;margin:8px 0 12px}
.tgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:24px;align-items:start}

.tcard h3{margin:2px 0 0;font-size:18px;font-weight:800}.tcard.wide{grid-column:1/-1}
.tcard .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

function todayIso(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

  var sc=schedeOf(u.id),o={att:false,scad:false,ck:false};
  if(!sc.length||!sc[0].data||isNaN(Date.parse(sc[0].data)))return o;
  var end=sc[0].cambio||addDays(sc[0].data,42),left=-ago(end),last=u.ck&&u.ck>sc[0].data?u.ck:sc[0].data;

// Archivio nel browser (IndexedDB): i dati restano su questo dispositivo, senza server
var Store=(function(){
  var db=null;
  function open(){return new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error('noidb'));return}
    var r=indexedDB.open('speaking',1);
    r.onupgradeneeded=function(){['utenti','schede'].forEach(function(n){if(!r.result.objectStoreNames.contains(n))r.result.createObjectStore(n,{keyPath:'id'})})};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  })}
  function tx(n,mode,fn){return new Promise(function(res,rej){
    var t=db.transaction(n,mode),q=fn(t.objectStore(n));
    t.oncomplete=function(){res(q&&q.result)};
    t.onerror=t.onabort=function(){rej(t.error)};
  })}

    load:function(){
      return open().then(function(d){
        db=d;
        if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
        return Promise.all([tx('utenti','readonly',function(s){return s.getAll()}),tx('schede','readonly',function(s){return s.getAll()})]);
      }).then(function(r){
        U=r[0]||[];SCH=r[1]||[];
      }).catch(function(){
        db=null;
        showNotice('Archivio del browser non disponibile (navigazione privata?): i dati non verranno salvati.');
      });
    },
    put:function(n,o){return db?tx(n,'readwrite',function(s){return s.put(o)}):Promise.resolve()},
    del:function(n,id){return db?tx(n,'readwrite',function(s){return s.delete(id)}):Promise.resolve()}
  };
})();

function trendPts(u,k){
  var out=[];
  schedeOf(u).forEach(function(sc){var best=null;sc.es.forEach(function(e){if(ekey(e.n)===k&&e.k!==''&&e.k!=null&&!isNaN(+e.k)){var v=+e.k;if(best===null||v>best)best=v}});if(best!==null)out.push({d:sc.data,t:Date.parse(sc.data),v:best})});
  return out.sort(function(a,b){return a.t-b.t});
}
function sdate(iso){var f=fdate(iso);return f.slice(0,6)+f.slice(8)}
function drawChart(ser){
  var W=600,H=260,L=44,R=16,T=14,B=30,all=[],ts=[];
  ser.forEach(function(s){s.pts.forEach(function(p){all.push(p.v);ts.push(p.t)})});
  if(!all.length)return '<div class="status">Nessun carico registrato per questi esercizi.</div>';
  var vmin=Math.min.apply(null,all),vmax=Math.max.apply(null,all),pad=(vmax-vmin)||vmax||1;
  vmin=Math.max(0,vmin-pad*.15);vmax=vmax+pad*.15;
  var tmin=Math.min.apply(null,ts),tmax=Math.max.apply(null,ts),dt=(tmax-tmin)||1;
  function X(t){return tmax===tmin?L+(W-L-R)/2:L+(t-tmin)/dt*(W-L-R)}
  function Y(v){return T+(1-(v-vmin)/(vmax-vmin))*(H-T-B)}
  var g='',i;
  for(i=0;i<=4;i++){var v=vmin+(vmax-vmin)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fnum(Math.round(v*10)/10)+'</text>'}
  var dates=[];ser.forEach(function(s){s.pts.forEach(function(p){if(dates.indexOf(p.d)<0)dates.push(p.d)})});dates.sort();
  var pick=dates.length<=5?dates:[0,1,2,3,4].map(function(j){return dates[Math.round(j*(dates.length-1)/4)]});
  pick.forEach(function(d){g+='<text x="'+X(Date.parse(d))+'" y="'+(H-8)+'" text-anchor="middle">'+sdate(d)+'</text>'});
  ser.forEach(function(s){
    if(s.pts.length>1)g+='<polyline style="stroke:'+s.color+'" points="'+s.pts.map(function(p){return X(p.t)+','+Y(p.v)}).join(' ')+'"/>';
    s.pts.forEach(function(p){g+='<circle cx="'+X(p.t)+'" cy="'+Y(p.v)+'" r="4.5" style="fill:'+s.color+'"><title>'+esc(s.name)+' · '+fdate(p.d)+' · '+fnum(p.v)+' kg</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del carico in kg nel tempo">'+g+'</svg>';
}

}

    var r=edRowFrom(e.role==='main'?Object.assign({},e,{role:'acc'}):e,c);if(b.lk&&rows.length)r.lk=true;rows.push(r)}});
  closeModal();
  if(!rows.length){st('edstat','Nessun esercizio adatto a questo profilo per il blocco scelto: aggiungilo dalla libreria.');return}
  var es=D.es.filter(function(x){return x.n||x.lk});
  D.es=b.top?rows.concat(es):es.concat(rows);D.es[0].lk=false;
  if(sgAuto()&&!b.empty)ED.sg=b.top?rows.length-1:D.es.length-1;
  edMark();edRefresh();st('edstat','Aggiunto «'+b.t+'»: '+rows.length+(rows.length===1?' riga':' righe')+'. Modifiche non salvate.');
}
function addGenDay(type){if(!DT[type]||!ED.sc)return;
  var c=gctx||profile({}),used=edUsed(),tpl=DT[type][ED.sc.days.length%DT[type].length].map(slot),es=[];
  tpl.forEach(function(sl){var e=pick(sl,c,used,es);if(e){es.push(e);used[e.n]=(used[e.n]||0)+1}});
  var nm=0,rows=es.map(function(e){if(e.role==='main'&&++nm>2)e=Object.assign({},e,{role:'acc'});return edRowFrom(e,c)});
  closeModal();ED.sc.days.splice(ED.day+1,0,{t:DTT[type],es:rows.length?rows:[{}]});ED.day++;ED.sg=null;edMark();renderEd();
  st('edstat','Aggiunta la seduta «'+DTT[type]+'» con '+rows.length+' esercizi. Modifiche non salvate.');
}
document.addEventListener('input',function(e){
  if(cur!=='ed')return;var t=e.target;
  if(t.id==='edq'){ED.q=t.value;edChips();return}
  if(t.id==='libq'||t.id==='edsel'||!ED.sc)return;
  var sf=t.getAttribute('data-sf');
  if(sf){if(sf==='dayt'){ED.sc.days[ED.day].t=t.value;gid('edtabs').innerHTML=edTabs()}else if(sf==='freq'){ED.sc.freq=+t.value;gid('edvol').innerHTML=edVolHtml()}else ED.sc[sf]=t.value;edMark();return}
  var f=t.getAttribute('data-f'),tr=t.closest('tr[data-i]');if(!f||!tr)return;
  var x=ED.sc.days[ED.day].es[+tr.getAttribute('data-i')];if(!x)return;
  x[f]=(f==='s'||f==='k'||f==='rec')?num(t.value):t.value;
  if(f==='nt')x.auto=0;
  if(f==='n'){var rec=edAuto(x,t.value);if(rec)edFill(tr,x);var iw=tr.querySelector('.inw');if(iw)iw.innerHTML=injTagN(t.value,gctx);
    if(rec&&sgAuto()){ED.sg=+tr.getAttribute('data-i');edSgUpdate()}else if(ED.sg===+tr.getAttribute('data-i')&&!rec){ED.sg=null;edSgUpdate()}}
  edMark();
  if(f==='n'||f==='s'||f==='m'){gid('edvol').innerHTML=edVolHtml();gid('edtabs').innerHTML=edTabs()}
  if(f==='n')gid('edleg').innerHTML=legendHtml(ED.sc.days[ED.day].es);
});
document.addEventListener('change',function(e){if(cur!=='ed'||e.target.id!=='edsel')return;var v=e.target.value;e.target.value=ED.sid||'';if(!v)return;guardGen(function(){edLoad(ED.uid,v);renderEd()})});
document.addEventListener('toggle',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-ko');if(k)ED.open[k]=e.target.open},true);
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-act="edopen"]');
  if(o){var sid=o.getAttribute('data-id'),sc=sid?findS(sid):null,uid=sc?sc.uid:o.getAttribute('data-uid');closeModal();guardGen(function(){openEd(uid,sid)});return}
  if(cur!=='ed')return;
  var c=e.target.closest('[data-eda]');if(c){var id=c.getAttribute('data-eda');if(String(id)===String(ED.uid))return;guardGen(function(){edLoad(id,null);renderEd()});return}
  var dd=e.target.closest('[data-edd]');if(dd){ED.day=+dd.getAttribute('data-edd');ED.sg=null;renderEd();return}
  var bk=e.target.closest('[data-blk]');if(bk){addBlock(bk.getAttribute('data-blk'));return}
  var a=e.target.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');if(k.slice(0,2)!=='ed')return;
  var s=ED.sc,D=s&&s.days[ED.day],tr=a.closest('tr[data-i]'),i=tr?+tr.getAttribute('data-i'):-1,sw;
  if(k==='ednew')guardGen(function(){edNew();renderEd()});
  else if(k==='edgen')guardGen(function(){ED.dirty=false;suid=ED.uid;openGen()});
  else if(!s)return;
  else if(k==='edaddday'){s.days.push({t:'Seduta '+(s.days.length+1),es:[{}]});ED.day=s.days.length-1;ED.sg=null;edMark();renderEd()}
  else if(k==='eddupday'){var cp=JSON.parse(JSON.stringify(D));cp.t=(D.t||'Seduta')+' (copia)';s.days.splice(ED.day+1,0,cp);ED.day++;ED.sg=null;edMark();renderEd()}
  else if(k==='edrmday'){if(s.days.length<2)return;var n=D.es.filter(function(x){return x.n}).length;
    modal('<h3>Eliminare la seduta?</h3><p>«'+esc(D.t)+'» e '+(n===1?'il suo esercizio':'i suoi '+n+' esercizi')+' verranno tolti dalla scheda. Diventa definitivo solo quando salvi.</p><div class="mrow"><button data-act="mclose">Annulla</button><button class="danger" data-act="edrmdayok">Elimina seduta</button></div>')}
  else if(k==='edrmdayok'){closeModal();s.days.splice(ED.day,1);ED.day=Math.max(0,ED.day-1);ED.sg=null;edMark();renderEd()}
  else if(k==='edaddex'){D.es.push({});edMark();edRefresh();var L=gid('edrows').querySelectorAll('[data-f="n"]');L[L.length-1].focus()}
  else if(k==='edrm'){if(D.es.length>1)D.es.splice(i,1);else D.es[0]={};D.es[0].lk=false;if(ED.sg===i)ED.sg=null;else if(ED.sg>i)ED.sg--;edMark();edRefresh()}
  else if(k==='edup'&&i>0){sw=D.es[i-1];D.es[i-1]=D.es[i];D.es[i]=sw;D.es[0].lk=false;if(ED.sg===i)ED.sg=i-1;else if(ED.sg===i-1)ED.sg=i;edMark();edRefresh()}
  else if(k==='eddown'&&i>-1&&i<D.es.length-1){sw=D.es[i+1];D.es[i+1]=D.es[i];D.es[i]=sw;D.es[0].lk=false;if(ED.sg===i)ED.sg=i+1;else if(ED.sg===i+1)ED.sg=i;edMark();edRefresh()}
  else if(k==='edsg'){if(!D.es[i]||!D.es[i].n){st('edstat','Scrivi o scegli prima l’esercizio della riga: le proposte si abbinano a quello.');return}ED.sg=ED.sg===i?null:i;edSgUpdate()}
  else if(k==='edlk'&&i>0){D.es[i].lk=!D.es[i].lk;edMark();edRefresh()}
  else if(k==='edswap')openLib({ed:1,i:i});
  else if(k==='edlib')openLib({ed:1,i:null});
  else if(k==='edblock')openBlock();
  else if(k==='edaddgen')addGenDay(gid('blkday').value);
  else if(k==='edregw'){s.wu=genWarm(s.days.map(function(d){return {es:d.es.filter(function(x){return x.n})}}));edMark();renderEd()}
  else if(k==='edregc'){s.cd=genCool(flatEs(s.days).filter(function(x){return x.n}));edMark();renderEd()}
  else if(k==='edsave')edSave(false);
  else if(k==='edcopy')edSave(true);
  else if(k==='edrevert'){edLoad(ED.uid,ED.sid);renderEd()}
  else if(k==='edprev')viewScheda('__ed');
});

function b2d(b){return new Promise(function(ok,ko){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=ko;r.readAsDataURL(b)})}
async function exportBackup(){
  try{
    var us=[];
    for(var i=0;i<U.length;i++){var o=Object.assign({},U[i]);
      for(var s of ['frontBlob','backBlob']){if(o[s] instanceof Blob)o[s]={__img:await b2d(o[s])}}
      us.push(o)}
    var d={app:'speaking',versione:1,esportato:new Date().toISOString(),utenti:us,schede:SCH};
    await saveBlob(new Blob([JSON.stringify(d)],{type:'application/json'}),'Speaking_backup_'+new Date().toISOString().slice(0,10)+'.json');
    st('bkstat','Backup esportato: '+U.length+' clienti e '+SCH.length+' schede.');
  }catch(e){st('bkstat','Esportazione non riuscita. Riprova.')}
}
var pend=null;
async function readImport(file){
  try{
    var d=JSON.parse(await file.text());
    if(!d||d.app!=='speaking'||!Array.isArray(d.utenti)||!Array.isArray(d.schede))throw new Error('fmt');
    pend=d;
    modal('<h3>Importa backup</h3><p>Il file contiene '+d.utenti.length+' clienti e '+d.schede.length+' schede'+(d.esportato?' (esportato il '+fdate(String(d.esportato).slice(0,10))+')':'')+'.</p><p class="status"><b>Unisci</b> aggiunge i dati del file a quelli presenti e aggiorna i clienti e le schede già esistenti. <b>Sostituisci</b> cancella tutto ciò che c’è ora e carica solo il file.</p><div class="status" id="impstat"></div><div class="mrow"><button data-act="mclose">Annulla</button><button data-act="impmerge">Unisci</button><button class="danger" data-act="imprepl">Sostituisci</button></div>');
  }catch(e){st('bkstat','File non valido: scegli un backup JSON esportato da Speaking.')}
}
async function mergeIn(arr,items,name){
  for(var it of items){await Store.put(name,it);var k=arr.findIndex(function(z){return String(z.id)===String(it.id)});if(k>-1)arr[k]=it;else arr.push(it)}
}
async function applyImport(replace){
  var d=pend;if(!d)return;
  try{
    var us=[];
    for(var o of d.utenti){
      if(!o||typeof o!=='object'||o.id==null)continue;
      var c=Object.assign({},o);
      for(var s of ['frontBlob','backBlob']){if(c[s]&&c[s].__img){c[s]=await (await fetch(c[s].__img)).blob()}else delete c[s]}
      us.push(c)}
    var sc=d.schede.filter(function(x){return x&&typeof x==='object'&&x.id!=null&&Array.isArray(x.es)});
    if(replace){
      for(var x of U.slice())await Store.del('utenti',x.id);
      for(var y of SCH.slice())await Store.del('schede',y.id);
      U.length=0;SCH.length=0}
    await mergeIn(U,us,'utenti');await mergeIn(SCH,sc,'schede');
    pend=null;closeModal();render();
    st('bkstat','Backup importato: '+us.length+' clienti e '+sc.length+' schede.');
  }catch(e){st('impstat','Importazione non riuscita. I dati non sono stati modificati del tutto: riprova.')}
}
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a)return;var k=a.getAttribute('data-act');
  if(k==='exp')exportBackup();
  else if(k==='imp'){var f=document.getElementById('impf');if(f)f.click()}
  else if(k==='impmerge')applyImport(false);
  else if(k==='imprepl')applyImport(true);
  else if(k==='prn')window.print();
  else if(k==='gosch'){closeModal();suid=a.getAttribute('data-id');cur='schede';sdm=false;ssel={};trend=[];eq='';render();window.scrollTo(0,0)}
});
