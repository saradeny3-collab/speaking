<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carma Medical Wellness</title>
<style>
:root{--bg:#f3f7f6;--surface:#fff;--text:#12302b;--muted:#5d7872;--line:#dbe6e3;--brand:#0f766e;--brand-soft:#d9f0ec;--c1:#0f766e;--c2:#c2410c;--c3:#1d4ed8;--c4:#7e22ce;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--surface:#152724;--surface:#152724;--text:#e6f2ef;--muted:#92b0aa;--line:#24403b;--brand:#2dd4bf;--brand-soft:#173833;--c1:#2dd4bf;--c2:#fb923c;--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a18;--surface:#152724;--text:#e6f2ef;--muted:#92b0aa;--line:#24403b;--brand:#2dd4bf;--brand-soft:#173833;--c1:#2dd4bf;--c2:#fb923c;--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.preview{display:flex;gap:6px;justify-content:center;padding:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.preview button{border:1px solid var(--line);background:none;color:var(--muted);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.preview button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage{display:flex;justify-content:center;padding:0}
.app{width:100%;background:var(--bg);min-height:calc(100vh - 54px);position:relative;display:flex;flex-direction:column}
.stage.mobile .app{max-width:400px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stage.tablet .app{max-width:1024px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
header h1{font-size:18px;margin:0;line-height:1.2}
header small{color:var(--muted);font-size:13px}
.layout{display:flex;flex:1;min-height:0}
nav.side{display:none}
main{flex:1;padding:20px;padding-bottom:90px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.card .ic svg,.tab svg,.side button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .stat{margin-top:auto;font-size:13px;color:var(--col);font-weight:600}
.panel{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.back{background:none;border:none;color:var(--brand);font:inherit;cursor:pointer;padding:0 0 12px}
.tabbar{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}
.tab[aria-current="true"]{color:var(--brand);font-weight:600}
.stage.tablet nav.side{display:flex;flex-direction:column;gap:4px;width:220px;padding:16px 12px;background:var(--surface);border-right:1px solid var(--line)}
.stage.tablet .side button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--muted);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
.stage.tablet .side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.stage.tablet .tabbar{display:none}
.stage.tablet main{padding:28px;padding-bottom:28px}
.stage.tablet .grid{grid-template-columns:1fr 1fr}
.stage.tablet .card{min-height:170px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.uact{display:flex;gap:8px;flex-shrink:0}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0}
.ab .i{font-size:26px;line-height:1;font-weight:400}.ab .t{display:none}
.ab.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ab.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.stage.tablet .ab{width:auto;height:auto;border-radius:12px;padding:10px 18px}
.stage.tablet .ab .i{display:none}.stage.tablet .ab .t{display:inline}
.search{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.dbar div{display:flex;gap:8px}
.dbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.dbar .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.dbar button:disabled{opacity:.5;cursor:default}
.urow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.urow.sel{border-color:#dc2626}
.urow input[type=checkbox]{width:20px;height:20px;margin-top:10px;flex-shrink:0;accent-color:#dc2626}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.cells b{color:var(--text);font-size:16px}
.cells span{overflow:hidden;text-overflow:ellipsis}
.uhead{display:none}
.stage.tablet .uhead{display:grid;padding:0 14px 8px 68px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage.tablet .cells{display:grid;grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px;align-items:center}
.stage.tablet .uhead{grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px}
.stage.tablet .urow{align-items:center}
.stage.tablet .urow input[type=checkbox]{margin-top:0}
.stage.tablet .cells{font-size:13px}.stage.tablet .cells b{font-size:15px}
.stage.tablet .app,.stage.tablet .app{max-width:1024px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0 0 4px}.mbox label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mbox input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mrow button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.mrow .pri{background:var(--brand);border-color:var(--brand);color:#fff}.mrow .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.idbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.idrow{display:flex;gap:10px;flex-wrap:wrap}
.drop{flex:1;min-width:130px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.drop input{font-size:12px;padding:6px;max-width:100%}
.drop img{display:none;width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.idbox button{padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.idbox .idrow button{background:var(--surface);color:var(--text);border-color:var(--line)}
.idbox button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}
.dc{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}.det dt{color:var(--muted)}.det dd{margin:0;word-break:break-word}
.btns{display:flex;gap:6px}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.pb.cam{background:var(--brand);border-color:var(--brand);color:#fff}
.idbox pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.idbox summary{font-size:12px;color:var(--muted);cursor:pointer}
.stage.tablet .cells.two{grid-template-columns:1fr 2fr}
.trend{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.trend h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-width:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart line{stroke:var(--line);stroke-width:1}.chart text{font-size:11px;fill:var(--muted)}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.leg{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.mbox.wide{max-width:560px}
.exr{display:grid;grid-template-columns:auto 1.7fr .7fr .7fr .8fr auto;gap:6px;align-items:center}
.lkb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:36px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.lkb:disabled{opacity:.35;cursor:default}
.exr.lk .lkb{background:var(--brand);border-color:var(--brand);color:#fff}
.exr.grp{border-left:3px solid var(--brand);padding-left:6px;margin-left:-9px}
.exr input{padding:8px;min-width:0}
.xr{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;width:32px;height:36px;font-size:18px;cursor:pointer}
.addx{align-self:flex-start;border:1px dashed var(--brand);background:none;color:var(--brand);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.stab{width:100%;border-collapse:collapse;font-size:14px}.stab th,.stab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.stab th{color:var(--muted);font-weight:600;font-size:12px}
/* login: attivare a programma finito */
#login{display:none;position:absolute;inset:0;z-index:5;background:var(--bg);align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
.lbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lbox .logo{margin:0 auto;width:64px;height:64px;font-size:30px;border-radius:18px}
.lbox input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.lbox button{padding:12px;border:none;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}

</style>
</head>
<body>
<div class="preview" role="group" aria-label="Anteprima">
  <button id="bm" aria-pressed="true">Mobile</button>
  <button id="bt" aria-pressed="false">Tablet</button>
</div>
<div class="stage mobile" id="stage">
<div class="app">
  <div id="login" aria-hidden="true">
    <div class="lbox">
      <div class="logo">C</div>
      <h2>Carma Medical Wellness</h2>
      <input type="email" placeholder="Email" autocomplete="username">
      <input type="password" placeholder="Password" autocomplete="current-password">
      <button type="button" onclick="document.getElementById('login').classList.remove('on')">Accedi</button>
    </div>
  </div>
  <header>
    <div class="logo">C</div>
    <div><h1>Carma Medical Wellness</h1><small>Gestione palestra</small></div>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
</div>
<script>
// Impostare a true quando il programma è finito, per mostrare la schermata di login
var LOGIN_ATTIVO = false;
if (LOGIN_ATTIVO) { var l = document.getElementById('login'); l.classList.add('on'); l.setAttribute('aria-hidden','false'); }

var I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.4c2 .7 3.5 2.5 3.5 5.6"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  ev:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>'
};
var S = [
  {id:'utenti',t:'Utenti',d:'Iscritti, anagrafica e abbonamenti',i:I.users,c:'var(--c1)',s:'Gestisci iscritti'},
  {id:'schede',t:'Schede allenamento',d:'Crea e assegna programmi di allenamento',i:I.plan,c:'var(--c2)',s:'Gestisci schede'},
  {id:'calendario',t:'Calendario',d:'Corsi, appuntamenti e prenotazioni',i:I.cal,c:'var(--c3)',s:'Apri calendario'},
  {id:'eventi',t:'Eventi',d:'Open day, workshop e iniziative',i:I.ev,c:'var(--c4)',s:'Gestisci eventi'}
];
var cur = 'home';
function render(){
  var m = document.getElementById('main'), h = '';
  if (cur === 'home') {
    h = '<h2>Benvenuto</h2><p class="sub">Scegli una sezione per iniziare.</p><div class="grid">' +
      S.map(function(x){return '<button class="card" style="--col:'+x.c+'" data-go="'+x.id+'"><div class="ic">'+x.i+'</div><h3>'+x.t+'</h3><p>'+x.d+'</p><span class="stat">'+x.s+' →</span></button>'}).join('') + '</div>';
  } else {
    var x = S.filter(function(y){return y.id===cur})[0];
    h = '<button class="back" data-go="home">← Home</button><h2>'+x.t+'</h2><p class="sub">'+x.d+'</p><div class="panel">Sezione in sviluppo.</div>';
  }
  m.innerHTML = h;
  if (cur === 'utenti') renderUtenti();
  if (cur === 'schede') renderSchede();
  var items = [{id:'home',t:'Home',i:I.home}].concat(S.map(function(x){return {id:x.id,t:x.id==='schede'?'Schede':x.t,i:x.i}}));
  document.getElementById('tabbar').innerHTML = items.map(function(x){return '<button class="tab" data-go="'+x.id+'"'+(x.id===cur?' aria-current="true"':'')+'>'+x.i+'<span>'+x.t+'</span></button>'}).join('');
  document.getElementById('side').innerHTML = items.map(function(x){var f=x.id==='schede'?'Schede allenamento':x.t;return '<button data-go="'+x.id+'"'+(x.id===cur?' aria-current="true"':'')+'>'+x.i+'<span>'+f+'</span></button>'}).join('');
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-go]'); if (b) { cur = b.getAttribute('data-go'); render(); window.scrollTo(0,0); }
});
function setView(v){
  document.getElementById('stage').className = 'stage ' + v;
  document.getElementById('bm').setAttribute('aria-pressed', v==='mobile');
  document.getElementById('bt').setAttribute('aria-pressed', v==='tablet');
}
document.getElementById('bm').onclick = function(){setView('mobile')};
document.getElementById('bt').onclick = function(){setView('tablet')};
var uid = 10;
var U = [
 {id:1,n:'Marco',c:'Rossi',d:'1985-03-12',cf:'RSSMRC85C12A462X',t:'333 1234567',e:'marco.rossi@email.it',ci:'Ascoli Piceno'},
 {id:2,n:'Giulia',c:'Bianchi',d:'1992-07-25',cf:'BNCGLI92L65A462K',t:'347 7654321',e:'giulia.bianchi@email.it',ci:'San Benedetto'},
 {id:3,n:'Luca',c:'Ferrari',d:'1978-11-03',cf:'FRRLCU78S03A462P',t:'320 1122334',e:'luca.ferrari@email.it',ci:'Ascoli Piceno'}
];
var uq = '', dm = false, sel = {}, draft = {front:null,back:null};
var dbCol = null, caps = {sample:null,assets:null,down:null};
var sState = window.claude && window.claude.use ? 'pending' : 'local';
function sampleMsg(){
  if(sState==='ok') return 'Carica fronte e/o retro per compilare i campi in automatico.';
  if(sState==='local') return 'Carica fronte e/o retro per compilare i campi in automatico (la prima lettura scarica il modello di riconoscimento: serve internet).';
  if(sState==='pending') return 'Verifica della lettura automatica in corso…';
  if(sState==='none') return 'Lettura automatica non disponibile: compila i campi a mano.';
  return 'Lettura automatica non disponibile per questo profilo o in questa vista: compila i campi a mano.';
}
(async function(){
  var c = window.claude; if(!c || !c.use) return;
  c.use('assets').then(function(x){caps.assets=x}).catch(function(){});
  c.use('downloads').then(function(x){caps.down=x}).catch(function(){});
  c.use('sample').then(function(x){
    caps.sample=x; sState=x?'ok':'off';
    var r=document.getElementById('rstat'), br=document.getElementById('bread');
    if(r&&!draft.front&&!draft.back) r.textContent=sampleMsg();
    if(br&&x&&(draft.front||draft.back)) br.disabled=false;
  }).catch(function(){sState='off'});
  try{
    var db = await c.use('db');
    if(db){
      dbCol = db.collection('utenti'); U = [];
      dbSch = db.collection('schede'); SCH = [];
      dbSch.onSnapshot(function(q){SCH=q.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});refreshSchede()},function(){});
      dbCol.onSnapshot(function(s){
        U = s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        if(cur==='utenti' && document.getElementById('ulist')) listUtenti();
        refreshSchede();
      }, function(){});
    }
  }catch(e){}
})();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fdate(s){if(!s)return '—';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function filtered(){
  var q=uq.toLowerCase().trim();
  return U.filter(function(u){return !q||[u.n,u.c,u.cf,u.t,u.e,u.ci].join(' ').toLowerCase().indexOf(q)>-1})
   .sort(function(a,b){return (a.c+a.n).localeCompare(b.c+b.n)});
}
function renderUtenti(){
  document.getElementById('main').innerHTML =
   '<div class="uh"><div><h2>Utenti</h2><p class="sub" id="ucount"></p></div><div class="uact">'+
   '<button class="ab pri" data-act="add" aria-label="Crea utente"><span class="i">+</span><span class="t">Crea</span></button>'+
   '<button class="ab" id="bdel" data-act="del" aria-label="Elimina utenti"><span class="i">−</span><span class="t">Elimina</span></button></div></div>'+
   '<input class="search" id="usearch" type="search" placeholder="Cerca per nome, codice fiscale, email…" value="'+esc(uq)+'">'+
   '<div id="dbar"></div><div id="ulist"></div>';
  document.getElementById('usearch').addEventListener('input',function(e){uq=e.target.value;listUtenti()});
  listUtenti();
}
function hasDoc(u){return !!(u.frontId||u.backId||u.frontBlob||u.backBlob)}
function listUtenti(){
  var L = filtered(), n = Object.keys(sel).length;
  document.getElementById('ucount').textContent = L.length + (L.length===1?' utente':' utenti');

// ---- Schede allenamento (struttura provvisoria: nome, data, note, elenco esercizi con serie, ripetizioni e carico) ----
var EXLIST=['Panca piana','Squat','Stacco da terra','Military press','Rematore con bilanciere','Trazioni','Lat machine','Leg press','Curl con bilanciere','Pushdown ai cavi','Affondi','Plank'];
function mkS(id,u,nome,data,es){return {id:'d'+id,uid:String(u),nome:nome,data:data,note:'',es:es.map(function(x){return {n:x[0],s:x[1],r:x[2],k:x[3],g:x[4]}})}}
var SCH=[
 mkS(1,1,'Forza base','2026-05-10',[['Panca piana',3,8,60],['Squat',3,8,80],['Rematore con bilanciere',3,10,50]]),
 mkS(2,1,'Forza base 2','2026-07-12',[['Panca piana',3,8,65],['Squat',3,8,87.5],['Rematore con bilanciere',3,10,55]]),
 mkS(3,1,'Ipertrofia','2026-09-14',[['Panca piana',4,8,70],['Squat',4,8,92.5],['Rematore con bilanciere',4,10,60]]),
 mkS(4,1,'Ipertrofia 2','2026-11-02',[['Panca piana',4,8,72.5,1],['Rematore con bilanciere',4,10,62.5,1],['Squat',4,8,97.5]])
];
var dbSch=null, sq='', suid=null, sdm=false, ssel={}, trend=[], eq='';
var TCOL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
function fnum(v){return String(v==null?'':v).replace('.',',')}
function ekey(n){return String(n||'').trim().toLowerCase()}
function schedeOf(u){return SCH.filter(function(x){return String(x.uid)===String(u)}).sort(function(a,b){return b.data.localeCompare(a.data)})}
function findS(id){return SCH.filter(function(x){return String(x.id)===String(id)})[0]}
function exNames(u){var m={};schedeOf(u).forEach(function(sc){sc.es.forEach(function(e){var k=ekey(e.n);if(k&&!m[k])m[k]=e.n})});return m}
function renderSchede(){
  var m=document.getElementById('main');
  if(!suid){
    m.innerHTML='<h2>Schede allenamento</h2><p class="sub" id="sucount"></p><input class="search" id="ssearch" type="search" placeholder="Cerca utente…" value="'+esc(sq)+'"><div id="sulist"></div>';
    listSU();return;
  }
  var u=find(suid); if(!u){suid=null;renderSchede();return}
  m.innerHTML='<button class="back" data-act="sback">← Utenti</button><div class="uh"><div><h2>'+esc(u.n+' '+u.c)+'</h2><p class="sub" id="sccount"></p></div><div class="uact">'+
   '<button class="ab pri" data-act="sadd" aria-label="Crea scheda"><span class="i">+</span><span class="t">Crea</span></button>'+
   '<button class="ab" id="sbdel" data-act="sdel" aria-label="Elimina schede"><span class="i">−</span><span class="t">Elimina</span></button></div></div>'+
   '<div id="sdbar"></div><div id="slist"></div>'+
   '<div class="trend"><h3>Andamento esercizi</h3><input class="search" id="esearch" type="search" placeholder="Cerca un esercizio…" value="'+esc(eq)+'" style="margin-bottom:8px"><div class="chips" id="echips"></div><div id="echart"></div></div>';
  listSchede();drawTrend();
}
function listSU(){
  var q=sq.toLowerCase().trim(),L=U.filter(function(u){return !q||(u.n+' '+u.c).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return (a.c+a.n).localeCompare(b.c+b.n)});
  document.getElementById('sucount').textContent=L.length+(L.length===1?' utente':' utenti');
  document.getElementById('sulist').innerHTML=L.length?L.map(function(u){var sc=schedeOf(u.id);
    return '<div class="urow" data-su="'+esc(u.id)+'" style="cursor:pointer"><div class="av">'+esc((u.n[0]||'')+(u.c[0]||'')).toUpperCase()+'</div><div class="cells two"><b>'+esc(u.n+' '+u.c)+'</b><span>'+(sc.length?sc.length+(sc.length===1?' scheda':' schede')+' · ultima del '+fdate(sc[0].data):'Nessuna scheda')+'</span></div></div>'}).join(''):'<div class="empty">Nessun utente. Aggiungili dalla sezione Utenti.</div>';
}
function listSchede(){
  if(!find(suid)||!document.getElementById('slist'))return;
  var L=schedeOf(suid),n=Object.keys(ssel).length;
  document.getElementById('sccount').textContent=L.length+(L.length===1?' scheda':' schede');
  document.getElementById('sdbar').innerHTML=sdm?'<div class="dbar"><span>Seleziona le schede da eliminare ('+n+')</span><div><button data-act="scancel">Annulla</button><button class="danger" data-act="sconfirm"'+(n?'':' disabled')+'>Elimina</button></div></div>':'';
  document.getElementById('sbdel').classList.toggle('danger',sdm);
  document.getElementById('slist').innerHTML=L.length?L.map(function(x,i){
    return '<div class="urow'+(ssel[x.id]?' sel':'')+'" data-srow="'+esc(x.id)+'" style="cursor:pointer">'+(sdm?'<input type="checkbox"'+(ssel[x.id]?' checked':'')+' aria-label="Seleziona">':'')+
    '<div class="cells two"><b>'+esc(x.nome)+(i===0?' <i class="dc">attuale</i>':'')+'</b><span>'+fdate(x.data)+' · '+x.es.length+(x.es.length===1?' esercizio':' esercizi')+'</span></div></div>'}).join(''):'<div class="empty">Nessuna scheda. Creane una con +.</div>';
}
function chipsHtml(){
  var names=exNames(suid),q=eq.toLowerCase().trim();
  if(!Object.keys(names).length)return '<span class="status">Crea una scheda con degli esercizi per vederne l’andamento.</span>';
  var h=trend.map(function(k,i){return '<button class="chip sel" style="border-color:'+TCOL[i]+'" data-act="erm" data-ex="'+esc(k)+'"><i class="dot" style="background:'+TCOL[i]+'"></i>'+esc(names[k]||k)+' ×</button>'}).join('');
  var sug=Object.keys(names).filter(function(k){return trend.indexOf(k)<0&&(!q||k.indexOf(q)>-1)}).sort().slice(0,12);
  return h+sug.map(function(k){return '<button class="chip" data-act="eadd" data-ex="'+esc(k)+'">'+esc(names[k])+'</button>'}).join('')+(sug.length||trend.length?'':'<span class="status">Nessun esercizio trovato.</span>');
}
function trendPts(u,k){
  var out=[];
  schedeOf(u).forEach(function(sc){var best=null;sc.es.forEach(function(e){if(ekey(e.n)===k&&e.k!==''&&e.k!=null&&!isNaN(+e.k)){var v=+e.k;if(best===null||v>best)best=v}});if(best!==null)out.push({d:sc.data,t:Date.parse(sc.data),v:best})});
  return out.sort(function(a,b){return a.t-b.t});
}
function sdate(iso){var f=fdate(iso);return f.slice(0,6)+f.slice(8)}
function drawChart(ser){
  var W=600,H=260,L=44,R=16,T=14,B=30,all=[],ts=[];
  ser.forEach(function(s){s.pts.forEach(function(p){all.push(p.v);ts.push(p.t)})});
  if(!all.length)return '<div class="status">Nessun carico registrato per questi esercizi.</div>';
  var vmin=Math.min.apply(null,all),vmax=Math.max.apply(null,all),pad=(vmax-vmin)||vmax||1;
  vmin=Math.max(0,vmin-pad*.15);vmax=vmax+pad*.15;
  var tmin=Math.min.apply(null,ts),tmax=Math.max.apply(null,ts),dt=(tmax-tmin)||1;
  function X(t){return tmax===tmin?L+(W-L-R)/2:L+(t-tmin)/dt*(W-L-R)}
  function Y(v){return T+(1-(v-vmin)/(vmax-vmin))*(H-T-B)}
  var g='',i;
  for(i=0;i<=4;i++){var v=vmin+(vmax-vmin)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fnum(Math.round(v*10)/10)+'</text>'}
  var dates=[];ser.forEach(function(s){s.pts.forEach(function(p){if(dates.indexOf(p.d)<0)dates.push(p.d)})});dates.sort();
  var pick=dates.length<=5?dates:[0,1,2,3,4].map(function(j){return dates[Math.round(j*(dates.length-1)/4)]});
  pick.forEach(function(d){g+='<text x="'+X(Date.parse(d))+'" y="'+(H-8)+'" text-anchor="middle">'+sdate(d)+'</text>'});
  ser.forEach(function(s){
    if(s.pts.length>1)g+='<polyline style="stroke:'+s.color+'" points="'+s.pts.map(function(p){return X(p.t)+','+Y(p.v)}).join(' ')+'"/>';
    s.pts.forEach(function(p){g+='<circle cx="'+X(p.t)+'" cy="'+Y(p.v)+'" r="4.5" style="fill:'+s.color+'"><title>'+esc(s.name)+' · '+fdate(p.d)+' · '+fnum(p.v)+' kg</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del carico in kg nel tempo">'+g+'</svg>';
}
function drawTrend(){
  var c=document.getElementById('echips'),g=document.getElementById('echart');if(!c||!g)return;
  c.innerHTML=chipsHtml();
  if(!trend.length){g.innerHTML='<div class="status">Seleziona uno o più esercizi (massimo 4) per vedere come cresce il carico nel tempo.</div>';return}
  var names=exNames(suid),ser=trend.map(function(k,i){return {name:names[k]||k,color:TCOL[i],pts:trendPts(suid,k)}});
  g.innerHTML=drawChart(ser)+'<div class="leg">'+ser.map(function(s){
    var a=s.pts[0],b=s.pts[s.pts.length-1],t;
    if(!a)t='nessun carico registrato';
    else if(s.pts.length===1)t=fnum(a.v)+' kg (un solo dato)';
    else{var dl=b.v-a.v,pc=a.v>0?Math.round(dl/a.v*1000)/10:0;t=fnum(a.v)+' → '+fnum(b.v)+' kg ('+(dl>=0?'+':'')+fnum(Math.round(dl*10)/10)+' kg, '+(pc>=0?'+':'')+fnum(pc)+'%)'}
    return '<span><i class="dot" style="background:'+s.color+'"></i><b>'+esc(s.name)+'</b>: '+t+'</span>'}).join('')+'</div>';
}
function exRow(n,s,r,k){return '<div class="exr"><button class="lkb" data-act="lk" aria-label="Superserie con l’esercizio sopra" title="Superserie con l’esercizio sopra">SS</button><input class="ex_n" list="exlist" placeholder="Esercizio" value="'+esc(n||'')+'"><input class="ex_s" type="number" min="0" inputmode="numeric" placeholder="Serie"><input class="ex_r" type="number" min="0" inputmode="numeric" placeholder="Rip."><input class="ex_k" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Kg"><button class="xr" data-act="rmex" aria-label="Rimuovi">×</button></div>'}
function refreshEx(){
  var rows=[].slice.call(document.querySelectorAll('#exs .exr'));
  rows.forEach(function(r,i){
    if(i===0)r.classList.remove('lk');
    r.querySelector('.lkb').disabled=(i===0);
    r.classList.toggle('grp',r.classList.contains('lk')||!!(rows[i+1]&&rows[i+1].classList.contains('lk')));
  });
}
function exLabel(e){return (e.g?'<i class="dc">SS '+String.fromCharCode(64+(+e.g))+'</i> ':'')+esc(e.n)}
function schedaForm(){
  var names=EXLIST.slice();Object.keys(exNames(suid)).forEach(function(k){var n=exNames(suid)[k];if(EXLIST.map(ekey).indexOf(k)<0)names.push(n)});
  modal('<h3>Nuova scheda</h3><label>Nome scheda *<input id="sc_n" type="text" placeholder="es. Forza, mese 1"></label><label>Data<input id="sc_d" type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><label>Note<input id="sc_note" type="text"></label>'+
   '<b style="font-size:14px">Esercizi</b><div class="status">Tocca SS per mettere un esercizio in superserie con quello sopra (puoi collegarne più di due).</div><div id="exs" style="display:flex;flex-direction:column;gap:6px">'+exRow()+exRow()+exRow()+'</div><button class="addx" data-act="addex">+ Aggiungi esercizio</button>'+
   '<datalist id="exlist">'+names.map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>'+
   '<div class="status" id="scstat"></div><div class="mrow"><button data-act="mclose">Annulla</button><button class="pri" id="scsave" data-act="smsave">Salva</button></div>');
  document.querySelector('#modal .mbox').classList.add('wide');refreshEx();
}
function num(v){return v===''||v==null||isNaN(+v)?'':+v}
async function saveScheda(){
  var nome=document.getElementById('sc_n').value.trim();
  if(!nome){document.getElementById('sc_n').focus();return}
  var es=[].map.call(document.querySelectorAll('#exs .exr'),function(r){return {n:r.querySelector('.ex_n').value.trim(),s:num(r.querySelector('.ex_s').value),r:num(r.querySelector('.ex_r').value),k:num(r.querySelector('.ex_k').value),lk:r.classList.contains('lk')}}).filter(function(x){return x.n});
  var gn=0;es.forEach(function(x,i){if(x.lk&&i>0){if(!es[i-1].g)es[i-1].g=++gn;x.g=es[i-1].g}});es.forEach(function(x){delete x.lk});
  if(!es.length){st('scstat','Aggiungi almeno un esercizio.');return}
  var o={uid:String(suid),nome:nome,data:document.getElementById('sc_d').value||new Date().toISOString().slice(0,10),note:document.getElementById('sc_note').value.trim(),es:es,ts:Date.now()};
  var b=document.getElementById('scsave');b.disabled=true;b.textContent='Salvataggio…';
  try{ if(dbSch)await dbSch.add(o); else{o.id='l'+(++uid);SCH.unshift(o)} closeModal();listSchede();drawTrend() }
  catch(e){b.disabled=false;b.textContent='Salva';st('scstat','Salvataggio non riuscito. Riprova.')}
}
function viewScheda(id){
  var sc=findS(id);if(!sc)return;var u=find(sc.uid);
  modal('<h3>'+esc(sc.nome)+'</h3><div class="status">'+(u?esc(u.n+' '+u.c)+' · ':'')+fdate(sc.data)+'</div>'+
   '<table class="stab"><thead><tr><th>Esercizio</th><th>Serie</th><th>Rip.</th><th>Kg</th></tr></thead><tbody>'+sc.es.map(function(e){return '<tr><td>'+exLabel(e)+'</td><td>'+esc(e.s)+'</td><td>'+esc(e.r)+'</td><td>'+esc(fnum(e.k))+'</td></tr>'}).join('')+'</tbody></table>'+(sc.note?'<p class="status">'+esc(sc.note)+'</p>':'')+
   '<div class="status" id="sdstat"></div><div class="mrow"><button data-act="mclose">Chiudi</button><button class="pri" data-act="sdl" data-id="'+esc(sc.id)+'">Scarica</button></div>');
}
function schedaHtml(u,sc){
  return '<!doctype html><html lang="it"><head><meta charset="utf-8"><title>'+esc(sc.nome)+'</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;color:#12302b}h1{margin:4px 0}table{border-collapse:collapse;width:100%;margin-top:16px}th,td{border:1px solid #cfdcd9;padding:8px 10px;text-align:left}th{background:#eaf4f2}.m{color:#5d7872;margin:0}.dc{font-style:normal;font-size:11px;font-weight:600;color:#0f766e;background:#d9f0ec;border-radius:99px;padding:1px 8px;margin-right:4px}</style></head><body><p class="m">Carma Medical Wellness</p><h1>'+esc(sc.nome)+'</h1><p class="m">'+esc(u?u.n+' '+u.c:'')+' · '+fdate(sc.data)+'</p><table><thead><tr><th>Esercizio</th><th>Serie</th><th>Ripetizioni</th><th>Carico (kg)</th></tr></thead><tbody>'+
   sc.es.map(function(e){return '<tr><td>'+exLabel(e)+'</td><td>'+esc(e.s)+'</td><td>'+esc(e.r)+'</td><td>'+esc(fnum(e.k))+'</td></tr>'}).join('')+'</tbody></table>'+(sc.note?'<p>'+esc(sc.note)+'</p>':'')+'</body></html>';
}
async function saveBlob(blob,name){
  try{
    if(caps.down){await caps.down.save({filename:name,data:blob})}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(!(e&&e.code==='declined'))throw e}
}
async function dlScheda(id){
  var sc=findS(id);if(!sc)return;var u=find(sc.uid);
  try{await saveBlob(new Blob([schedaHtml(u,sc)],{type:'text/html'}),('Scheda_'+(u?u.c+'_'+u.n:'')+'_'+sc.data+'.html').replace(/[^\w.\-]+/g,'_'))}
  catch(e){st('sdstat','Download non riuscito. Riprova.')}
}
async function doDelSchede(){
  var ids=Object.keys(ssel);
  if(dbSch){for(var i=0;i<ids.length;i++){try{await dbSch.doc(String(ids[i])).delete()}catch(e){}}}
  else SCH=SCH.filter(function(x){return !ssel[x.id]});
  ssel={};sdm=false;closeModal();listSchede();drawTrend();
}
async function dropSchedeOf(id){
  var L=schedeOf(id);
  if(dbSch){for(var i=0;i<L.length;i++){try{await dbSch.doc(String(L[i].id)).delete()}catch(e){}}}
  else SCH=SCH.filter(function(x){return String(x.uid)!==String(id)});
}
function refreshSchede(){
  if(cur!=='schede')return;
  if(document.getElementById('slist')){if(!find(suid)){suid=null;renderSchede()}else{listSchede();drawTrend()}}
  else if(document.getElementById('sulist'))listSU();
}
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='ssearch'){sq=t.value;listSU()}
  else if(t.id==='esearch'){eq=t.value;var c=document.getElementById('echips');if(c)c.innerHTML=chipsHtml()}
});
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');
  if(a){var k=a.getAttribute('data-act'),ex=a.getAttribute('data-ex');
    if(k==='sback'){suid=null;sdm=false;ssel={};trend=[];eq='';renderSchede()}
    else if(k==='sadd')schedaForm();
    else if(k==='addex'){document.getElementById('exs').insertAdjacentHTML('beforeend',exRow());refreshEx()}
    else if(k==='lk'){var rw=a.closest('.exr');if(rw){rw.classList.toggle('lk');refreshEx()}}
    else if(k==='rmex'){var r=a.closest('.exr');if(r&&document.querySelectorAll('#exs .exr').length>1){r.remove();refreshEx()}}
    else if(k==='smsave')saveScheda();
    else if(k==='sdel'){sdm=!sdm;ssel={};listSchede()}
    else if(k==='scancel'){sdm=false;ssel={};listSchede()}
    else if(k==='sconfirm'){var n=Object.keys(ssel).length;if(!n)return;modal('<h3>Elimina schede</h3><p>Vuoi eliminare '+n+(n===1?' scheda selezionata':' schede selezionate')+'? L’operazione non si può annullare.</p><div class="mrow"><button data-act="mclose">Annulla</button><button class="danger" data-act="sdodel">Elimina</button></div>')}
    else if(k==='sdodel')doDelSchede();
    else if(k==='sdl')dlScheda(a.getAttribute('data-id'));
    else if(k==='eadd'){if(trend.length<4){trend.push(ex);drawTrend()}}
    else if(k==='erm'){trend=trend.filter(function(x){return x!==ex});drawTrend()}
    return}
  var su=e.target.closest('[data-su]');
  if(su){suid=su.getAttribute('data-su');sdm=false;ssel={};trend=[];eq='';renderSchede();return}
  var sr=e.target.closest('[data-srow]');
  if(sr){var id=sr.getAttribute('data-srow');if(sdm){if(ssel[id])delete ssel[id];else ssel[id]=1;listSchede()}else viewScheda(id)}
});
setView(window.innerWidth>=768?'tablet':'mobile');
render();
</script>
