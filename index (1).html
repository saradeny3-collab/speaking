<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitCoach Gestionale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#0f1b2d; --nav-ic:#7d8ba1; --nav-on:#1d2d47;
  --bg:#eef1f6; --panel:#fff; --line:#e3e8ef; --text:#16202e; --mut:#6b778a;
  --accent:#1d6fe0; --sel:#e9eef6;
  --ok-bg:#d9f3e1; --ok:#1c7a3d; --warn-bg:#fdf0c7; --warn:#8a6100; --info-bg:#d8e9fb; --info:#1559b3;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1420; --panel:#151f2e; --line:#243248; --text:#e8edf5; --mut:#93a0b5; --sel:#1c2a40; --accent:#5b9bf5;
    --ok-bg:#183a27; --ok:#6fd49a; --warn-bg:#3d3112; --warn:#f0c55b; --info-bg:#173152; --info:#8bbcf8;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1420; --panel:#151f2e; --line:#243248; --text:#e8edf5; --mut:#93a0b5; --sel:#1c2a40; --accent:#5b9bf5;
  --ok-bg:#183a27; --ok:#6fd49a; --warn-bg:#3d3112; --warn:#f0c55b; --info-bg:#173152; --info:#8bbcf8;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:grid;grid-template-columns:68px 1fr;grid-template-rows:56px 1fr;grid-template-areas:"nav top" "nav main";overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

nav.side{grid-area:nav;background:var(--nav);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.logo{font-weight:700;font-size:22px;color:#4d9bff;margin-bottom:14px;font-style:italic}
nav.side button{width:44px;height:44px;border-radius:10px;color:var(--nav-ic);display:grid;place-items:center}
nav.side button:hover,nav.side button[aria-current]{background:var(--nav-on);color:#fff}
nav.side .out{margin-top:auto}

header.top{grid-area:top;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 20px}
header.top h1{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:8px;padding:0 12px;height:36px;color:var(--mut)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--text);outline:0}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--mut)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4d9bff,#1d4f9c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}

main{grid-area:main;display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:0}
main>section{overflow-y:auto;min-height:0}
.list{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px}
.list small{color:var(--mut);padding:0 8px}
.list h2{font-size:20px;padding:0 8px 10px}
.ath{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:10px 8px;border-radius:10px;border:1px solid transparent}
.ath+.ath{border-top-color:var(--line);border-radius:0}
.ath:hover{background:var(--sel)}
.ath[aria-pressed="true"]{background:var(--sel);border:1px solid var(--text);border-radius:10px}
.pic{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600}
.ath b{display:block;font-weight:600;margin-bottom:3px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;font-weight:500}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-info{background:var(--info-bg);color:var(--info)}

.center{padding:18px 22px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head .pic{width:40px;height:40px}
.head h2{font-size:21px}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 0;color:var(--mut);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--text);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.card header .ic{width:34px;height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center}
.card header h3{font-size:16px;flex:1}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:460px}
th{background:var(--bg);text-align:left;font-weight:500;color:var(--mut);padding:7px 10px}
td{padding:9px 10px;border-top:1px solid var(--line)}
td a{color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--mut)}

.right{padding:18px 18px 18px 0}
.right h4{font-size:15px;margin:16px 0 8px}
.chart{margin-bottom:10px}
.chart p{font-size:13px;font-weight:500;margin-bottom:2px}
.chart svg{width:100%;height:70px;stroke:none}
.chart path.l{fill:none;stroke:var(--text);stroke-width:2}
.chart path.a{fill:var(--accent);opacity:.12}
.note{font-size:13px;line-height:1.5;margin-bottom:12px}
.note+.note{padding-top:10px;border-top:1px solid var(--line)}

@media(max-width:1100px){main{grid-template-columns:240px minmax(0,1fr)}.right{display:none}}
@media(max-width:720px){
  body{grid-template-columns:1fr;grid-template-rows:56px 1fr 56px;grid-template-areas:"top" "main" "nav";overflow:auto}
  nav.side{flex-direction:row;justify-content:space-around;padding:6px}.logo,nav.side .out{display:none}
  header.top h1{display:none}
  main{grid-template-columns:1fr}.list{display:none}
}
</style>
</head>
<body>
<nav class="side" aria-label="Navigazione">
  <span class="logo">F</span>
  <button aria-label="Dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
  <button aria-label="Atleti" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.500 2.400 6.500 6M16 4.500a3.500 3.500 0 0 1 0 7M18 14.500c2 .7 3.500 2.500 3.500 5.500"/></svg></button>
  <button aria-label="Calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
  <button aria-label="Report"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 17v-4M12 17v-6M15 17v-2"/></svg></button>
  <button aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100 7 17M17 7l2.100-2.100"/></svg></button>
  <button class="out" aria-label="Esci"><svg viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button>
</nav>

<header class="top">
  <h1>FITCOACH GESTIONALE</h1>
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.500-3.500"/></svg><input id="q" type="search" placeholder="Cerca atleti, schede..." aria-label="Cerca"></label>
  <div class="tools">
    <button id="theme" aria-label="Cambia tema"><svg viewBox="0 0 24 24"><path d="M21 12.800A9 9 0 1 1 11.200 3a7 7 0 0 0 9.800 9.800z"/></svg></button>
    <button aria-label="Notifiche"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20h4"/></svg></button>
    <span class="avatar">CO</span>
  </div>
</header>

<main>
  <section class="list" aria-label="Elenco atleti">
    <small>Elenco rapido</small>
    <h2>Atleti</h2>
    <div id="athletes"></div>
  </section>

  <section class="center">
    <div class="head"><span class="pic" id="hpic"></span><h2 id="hname"></h2></div>
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="prog">Programma attuale</button>
      <button role="tab" aria-selected="false" data-tab="ana">Analisi e progressi</button>
      <button role="tab" aria-selected="false" data-tab="set">Impostazioni</button>
    </div>
    <div id="view"></div>
  </section>

  <section class="right" aria-label="Progressi atleta">
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:10px">Progressi atleta</h3>
      <div class="chart"><p>Volume allenamento (settimanale)</p><svg viewBox="0 0 200 70" preserveAspectRatio="none"><path class="a" d="M0 62 C30 50 45 30 70 40 S110 52 140 30 S180 20 200 18 V70 H0Z"/><path class="l" d="M0 62 C30 50 45 30 70 40 S110 52 140 30 S180 20 200 18"/></svg></div>
      <div class="chart"><p>Peso corporeo (mensile)</p><svg viewBox="0 0 200 70" preserveAspectRatio="none"><path class="a" d="M0 12 C40 18 70 30 110 34 S170 48 200 56 V70 H0Z"/><path class="l" d="M0 12 C40 18 70 30 110 34 S170 48 200 56"/></svg></div>
      <div class="chart"><p>Carico massimo squat (1RM)</p><svg viewBox="0 0 200 70" preserveAspectRatio="none"><path class="a" d="M0 62 C30 40 50 36 80 38 S130 40 160 28 S190 20 200 16 V70 H0Z"/><path class="l" d="M0 62 C30 40 50 36 80 38 S130 40 160 28 S190 20 200 16"/></svg></div>
    </div>
    <h4>Note check-in atleta</h4>
    <div class="card" id="notes"></div>
  </section>
</main>

<script>
const athletes=[
  {n:"Sara Rossi",s:"warn",c:"#c0577a"},{n:"Matteo Bianchi",s:"ok",c:"#3d4f6b"},
  {n:"Sara Verdi",s:"info",c:"#b8734a"},{n:"Marco Neri",s:"info",c:"#4a5d4a"},
  {n:"Luca Bianchi",s:"warn",c:"#2f3b52"},{n:"Giulia Conti",s:"ok",c:"#8a5a9c"}
];
const status={warn:["Scheda in scadenza","t-warn"],ok:["Attivo","t-ok"],info:["Richiesta check-in","t-info"]};
const blocks=[
  {t:"Riscaldamento",rows:[["Mobilità spalle","Video",3,10,6,"1 min"],["Riscaldamento generale","Video",4,6,8,"2 min"]]},
  {t:"Blocco forza",rows:[["Squat","Video",4,6,8,"2 min"],["Panca piana","Video",4,6,8,"2 min"],["Stacco rumeno","Video",4,6,8,"2 min"]]},
  {t:"Superset accessori",rows:[["Rematore","Video",3,10,7,"90 s"],["Military press","Video",3,8,7,"90 s"]]}
];
const notes=[["Ottima","Leggero fastidio spalla destra","Aumento volume"],["Buona","Nessuno","Aumento forza"]];
const $=s=>document.querySelector(s), ini=n=>n.split(" ").map(w=>w[0]).join("");
let cur=0, tab="prog";

function renderList(){
  const q=$("#q").value.toLowerCase();
  $("#athletes").innerHTML=athletes.map((a,i)=>({a,i})).filter(({a})=>a.n.toLowerCase().includes(q)).map(({a,i})=>
    `<button class="ath" data-i="${i}" aria-pressed="${i===cur}"><span class="pic" style="background:${a.c}">${ini(a.n)}</span><span><b>${a.n}</b><span class="tag ${status[a.s][1]}">${status[a.s][0]}</span></span></button>`).join("")||'<p class="empty">Nessun atleta trovato</p>';
}
function renderView(){
  const a=athletes[cur];
  $("#hname").textContent="Atleta: "+a.n;
  $("#hpic").style.background=a.c; $("#hpic").textContent=ini(a.n);
  if(tab==="prog"){
    $("#view").innerHTML=blocks.map(b=>`<div class="card"><header><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg></span><h3>${b.t}</h3><button aria-label="Opzioni">⋯</button></header>
    <div class="wrap"><table><thead><tr><th>Esercizio</th><th>Video</th><th>Set</th><th>Reps</th><th>RPE</th><th>Recupero</th></tr></thead><tbody>${b.rows.map(r=>`<tr><td>${r[0]}</td><td><a href="#">Apri video</a></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join("")}</tbody></table></div></div>`).join("");
  } else {
    $("#view").innerHTML=`<div class="card empty">${tab==="ana"?"Qui compariranno le analisi dettagliate di":"Qui compariranno le impostazioni di"} ${a.n}.</div>`;
  }
  $("#notes").innerHTML=notes.map(n=>`<p class="note"><b>Sensazione:</b> ${n[0]}<br><b>Problemi:</b> ${n[1]}<br><b>Obiettivo:</b> ${n[2]}</p>`).join("");
}
$("#athletes").addEventListener("click",e=>{const b=e.target.closest(".ath");if(b){cur=+b.dataset.i;renderList();renderView()}});
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;tab=b.dataset.tab;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));renderView()});
$("#q").addEventListener("input",renderList);
$("#theme").addEventListener("click",()=>{const d=document.documentElement,dark=d.dataset.theme==="dark"||(!d.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);d.dataset.theme=dark?"light":"dark"});
renderList();renderView();
</script>
</body>
</html>
